name: osec_mobile
description: OSEC - Online School of E-Commerce - Secure e-commerce video training platform
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # UI & Core
  provider: ^6.0.5
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2

  # Networking
  dio: ^5.4.0
  connectivity_plus: ^5.0.1

  # Storage
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^9.0.0
  sqflite: ^2.3.2
  path_provider: ^2.1.1

  # Video & Media
  video_player: ^2.8.0
  chewie: ^1.7.4
  screen_protector: ^1.5.2

  # Notifications
  firebase_core: ^4.0.0
  firebase_messaging: ^16.0.0
  flutter_local_notifications: ^17.2.3

  # Authentication
  sms_autofill: ^2.3.0

  # Navigation
  go_router: ^13.0.0

  # Utilities
  equatable: ^2.0.5
  dartz: ^0.10.1
  get_it: ^7.6.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  build_runner: ^2.4.7
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/fonts/
    - assets/videos/

  # Montserrat/Inter are shipped as variable fonts (Google Fonts no longer
  # publishes static per-weight files for these families) — a single file
  # per family covers every weight the theme uses (400/500/600/700).
  fonts:
    - family: Montserrat
      fonts:
        - asset: assets/fonts/Montserrat-Variable.ttf
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Variable.ttf

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/app_icon.png"
