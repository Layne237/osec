name: osec_mobile
description: OSEC - Online School of E-Commerce - Secure e-commerce video training platform
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # UI & Core
  provider: ^6.0.5
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2

  # Networking
  dio: ^5.4.0
  connectivity_plus: ^5.0.1

  # Storage
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^9.0.0
  sqflite: ^2.3.2
  path_provider: ^2.1.1

  # Video & Media
  video_player: ^2.8.0
  chewie: ^1.7.4
  screen_protector: ^1.5.2

  # Notifications
  firebase_messaging: ^14.7.6
  flutter_local_notifications: ^16.1.0

  # Authentication
  sms_autofill: ^2.3.0

  # Navigation
  go_router: ^13.0.0

  # Utilities
  equatable: ^2.0.5
  dartz: ^0.10.1
  get_it: ^7.6.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  build_runner: ^2.4.7
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/fonts/
    - assets/videos/

  fonts:
    - family: Montserrat
      fonts:
        - asset: assets/fonts/Montserrat-Regular.ttf
        - asset: assets/fonts/Montserrat-Bold.ttf
          weight: 700
        - asset: assets/fonts/Montserrat-SemiBold.ttf
          weight: 600
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/app_icon.png"
