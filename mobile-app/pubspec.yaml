name: osec_mobile
description: OSEC (Online School of E-Commerce) — Mobile platform for secure sale and delivery of e-commerce video training courses.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  provider: ^6.1.1

  # Networking
  dio: ^5.4.0

  # Local Storage
  shared_preferences: ^2.2.2
  sqflite: ^2.3.0
  flutter_secure_storage: ^9.0.0

  # Video Playback
  video_player: ^2.8.2
  chewie: ^1.7.4

  # Localization
  flutter_localizations:
    sdk: flutter
  intl: ^0.19.0

  # Utilities
  path_provider: ^2.1.1
  connectivity_plus: ^5.0.2
  cached_network_image: ^3.3.0
  shimmer: ^3.0.0
  cached_video_player: ^0.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  build_runner: ^2.4.7
  mockito: ^5.4.4
  sqflite_common_ffi: ^2.3.1

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/fonts/

  fonts:
    - family: Montserrat
      fonts:
        - asset: assets/fonts/Montserrat-Regular.ttf
        - asset: assets/fonts/Montserrat-Bold.ttf
          weight: 700
        - asset: assets/fonts/Montserrat-SemiBold.ttf
          weight: 600
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
